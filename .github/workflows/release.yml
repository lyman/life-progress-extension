name: Release

# 推 v* 标签时触发：校验版本 → 打包 extension/ 为 zip → 创建 GitHub Release 并附上 zip
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST="$(node -p "require('./extension/manifest.json').version")"
          [ "$TAG" = "$MANIFEST" ] || { echo "::error::tag v$TAG != manifest version $MANIFEST"; exit 1; }

      - name: Zip extension
        run: cd extension && zip -r "../life-progress-extension-${GITHUB_REF_NAME#v}.zip" .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "life-progress-extension-${GITHUB_REF_NAME#v}.zip" --generate-notes
